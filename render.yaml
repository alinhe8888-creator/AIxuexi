services:
  - type: web
    name: aixuexi-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DB_MODE
        value: postgres
      - key: FAMILY_STUDENT_EMAIL
        sync: false
      - key: FAMILY_STUDENT_PASSWORD
        sync: false
      - key: FAMILY_STUDENT_NAME
        sync: false
      - key: FAMILY_PARENT_EMAIL
        sync: false
      - key: FAMILY_PARENT_PASSWORD
        sync: false
      - key: FAMILY_PARENT_NAME
        sync: false
      - key: AI_TIMEOUT_MS
        value: 300000
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_API_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: QWEN_TEXT_MODEL
        value: qwen3.7-plus
      - key: QWEN_VISION_MODEL
        value: qwen3.7-plus
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: DEEPSEEK_THINKING
        value: disabled
      - key: DEEPSEEK_REASONING_EFFORT
        value: high
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_HOST
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: MAX_JSON_MB
        value: 30
      - key: MATERIAL_MAX_ZIP_MB
        value: 500

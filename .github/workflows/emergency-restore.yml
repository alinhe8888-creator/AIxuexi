name: Emergency Restore Complete Source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergency-restore-aixuexi
  cancel-in-progress: false

env:
  STABLE_COMMIT: a6046bc9464bee687fe701e91f1440b91d14f962
  VITE_API_BASE_URL: https://aixuexi-api.onrender.com
  VITE_USE_MOCK_API: "false"
  VITE_ALLOW_API_FALLBACK: "true"

jobs:
  restore-build-deploy:
    name: Restore, verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete stable source
        shell: bash
        run: |
          set -Eeuo pipefail

          git cat-file -e "${STABLE_COMMIT}^{commit}"

          # Remove the damaged application trees first, then restore the last
          # commit that was confirmed to build successfully.
          git rm -rf --ignore-unmatch src backend public scripts

          git checkout "${STABLE_COMMIT}" --             src             backend             public             scripts             package.json             package-lock.json             tsconfig.app.json             tsconfig.json             tsconfig.node.json             vite.config.ts             index.html             render.yaml             .env.example             .env.parent             .env.student

          echo "Stable source restored from ${STABLE_COMMIT}."

      - name: Verify restored source files
        shell: bash
        run: |
          set -Eeuo pipefail

          required=(
            src/auth/RequireRole.tsx
            src/auth/useAuth.ts
            src/auth/AuthContext.tsx
            src/components/AppErrorBoundary.tsx
            src/components/ProductionDataCleaner.tsx
            src/components/ToastViewport.tsx
            src/components/ui.tsx
            src/parent/ParentDataContext.tsx
            src/parent/useParentData.ts
            src/store/AppStore.tsx
            src/store/useAppStore.ts
            src/services/apiClient.ts
            src/services/authApi.ts
            src/types.ts
            src/pages/ChallengePage.tsx
            src/pages/DailyPlanPage.tsx
            src/pages/KnowledgeBasePage.tsx
            src/pages/LearningProfilePage.tsx
            src/pages/MistakeBookPage.tsx
            src/pages/NotFoundPage.tsx
            src/pages/OnboardingPage.tsx
            src/pages/PaperAnalysisPage.tsx
            src/pages/PhotoExplainPage.tsx
            src/pages/QuizPage.tsx
            src/pages/SettingsPage.tsx
            src/pages/SimulationPage.tsx
            src/pages/parent/ParentHomePage.tsx
            src/pages/parent/ParentMistakesPage.tsx
            src/pages/parent/ParentProgressPage.tsx
            src/pages/parent/ParentReportsPage.tsx
            src/pages/parent/ParentSettingsPage.tsx
          )

          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required restored file is missing"
              missing=1
            fi
          done

          [[ "$missing" -eq 0 ]]
          echo "All required source files are present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Build student portal
        run: npm run build:student

      - name: Build parent portal
        run: npm run build:parent

      - name: Build backend
        run: npm --prefix backend run build

      - name: Verify build outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f dist-student/index.html
          test -d dist-student/assets
          test -f dist-parent/index.html
          test -d dist-parent/assets
          test -d backend/dist
          echo "Student, parent and backend builds all passed."

      - name: Commit restored source
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes need to be committed."
          else
            git commit -m "fix: restore complete stable source [skip actions]"
            git push origin HEAD:main
          fi

      - name: Deploy student portal to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@latest pages deploy dist-student             --project-name=aixuexi             --branch=main             --commit-dirty=true

      - name: Deploy parent portal to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@latest pages deploy dist-parent             --project-name=aixuexi-parent             --branch=main             --commit-dirty=true

      - name: Final result
        run: |
          echo "Complete source restored, all three builds passed, and both Pages sites were deployed."

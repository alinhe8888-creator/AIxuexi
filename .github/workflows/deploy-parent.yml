name: Repair Source And Apply Private UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-source-private-ui
  cancel-in-progress: false

env:
  STABLE_COMMIT: a6046bc9464bee687fe701e91f1440b91d14f962
  VITE_API_BASE_URL: https://aixuexi-api.onrender.com
  VITE_USE_MOCK_API: "false"
  VITE_ALLOW_API_FALLBACK: "true"

jobs:
  repair-build-deploy:
    name: Restore source, apply UI, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore complete stable application source
        shell: bash
        run: |
          set -Eeuo pipefail

          git cat-file -e "${STABLE_COMMIT}^{commit}"

          rm -rf src backend public scripts

          git checkout "${STABLE_COMMIT}" --             src             backend             public             scripts             package.json             package-lock.json             tsconfig.app.json             tsconfig.json             tsconfig.node.json             vite.config.ts             index.html             render.yaml             .env.example             .env.parent             .env.student

          echo "Complete stable application source restored."

      - name: Apply actual private-family UI source files

      - name: Remove obsolete broken workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/emergency-restore.yml
          rm -f family-mode-upgrade.yml
          rm -f private-family-upgrade.yml

      - name: Verify complete source before installing
        shell: bash
        run: |
          set -Eeuo pipefail

          required=(
            src/types.ts
            src/auth/AuthContextObject.ts
            src/auth/RequireRole.tsx
            src/auth/useAuth.ts
            src/services/apiClient.ts
            src/services/authApi.ts
            src/components/AppErrorBoundary.tsx
            src/components/ProductionDataCleaner.tsx
            src/components/ToastViewport.tsx
            src/components/ui.tsx
            src/components/Charts.tsx
            src/parent/ParentDataContextObject.ts
            src/parent/useParentData.ts
            src/store/AppStore.tsx
            src/store/useAppStore.ts
            src/pages/ChallengePage.tsx
            src/pages/DailyPlanPage.tsx
            src/pages/KnowledgeBasePage.tsx
            src/pages/LearningProfilePage.tsx
            src/pages/MistakeBookPage.tsx
            src/pages/NotFoundPage.tsx
            src/pages/OnboardingPage.tsx
            src/pages/PaperAnalysisPage.tsx
            src/pages/PhotoExplainPage.tsx
            src/pages/QuizPage.tsx
            src/pages/ReportsPage.tsx
            src/pages/SettingsPage.tsx
            src/pages/SimulationPage.tsx
            src/pages/parent/ParentMistakesPage.tsx
            src/pages/parent/ParentProgressPage.tsx
            src/pages/parent/ParentReportsPage.tsx
            src/styles/private-family.css
          )

          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required source file is missing"
              missing=1
            fi
          done

          [[ "$missing" -eq 0 ]]
          echo "All required source files are present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Build student portal
        run: npm run build:student

      - name: Build parent portal
        run: npm run build:parent

      - name: Build backend
        run: npm --prefix backend run build

      - name: Verify actual UI and build outputs
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f dist-student/index.html
          test -d dist-student/assets
          test -f dist-parent/index.html
          test -d dist-parent/assets
          test -d backend/dist

          grep -R -q "private-login-page" dist-student/assets
          grep -R -q "private-login-page" dist-parent/assets

          if grep -R -q "不打扰孩子学习" dist-parent/assets; then
            echo "::error::Old promotional parent cover is still present."
            exit 1
          fi

          if grep -R -q "把错题、讲解、训练和复习" dist-student/assets; then
            echo "::error::Old promotional student cover is still present."
            exit 1
          fi

          echo "Both portals and backend built successfully with the new UI."

      - name: Commit repaired source and UI to main
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: restore complete source and apply private UI [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy student portal
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@latest pages deploy dist-student             --project-name=aixuexi             --branch=main             --commit-dirty=true

      - name: Deploy family view
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@latest pages deploy dist-parent             --project-name=aixuexi-parent             --branch=main             --commit-dirty=true

      - name: Done
        run: |
          echo "Complete source restored."
          echo "Actual UI TSX/CSS files committed."
          echo "Student, parent and backend builds passed."
          echo "Both Cloudflare Pages projects deployed."

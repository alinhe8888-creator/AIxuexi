name: Apply Family Mode Final Fix

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: family-mode-final-fix
  cancel-in-progress: true

jobs:
  apply-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write final source files
        shell: bash
        run: |
          echo "" | base64 --decode > /tmp/family-patch.tar.gz
          tar -xzf /tmp/family-patch.tar.gz -C .
          find src public scripts .github/workflows -maxdepth 4 -type f | sort

      - name: Apply family-only source cleanup
        run: node scripts/apply-family-mode.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Build student and overview sites
        run: npm run build:all

      - name: Install and verify backend
        run: |
          npm --prefix backend install --no-audit --no-fund
          npm --prefix backend run typecheck
          npm --prefix backend run build

      - name: Verify final output
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f dist-student/index.html
          test -f dist-parent/index.html
          test -f dist-student/_headers
          test -f dist-parent/_headers
          grep -R -q "https://aixuexi-api.onrender.com" dist-student/assets
          grep -R -q "https://aixuexi-api.onrender.com" dist-parent/assets
          ! grep -R -E "家长端|学生端|监护人|独立家长视图|只读权限" \
            src/pages/ParentAuthPage.tsx \
            src/pages/StudentAuthPage.tsx \
            src/components/ParentLayout.tsx \
            src/pages/parent/ParentSettingsPage.tsx
          echo "Final family mode build verified."

      - name: Commit source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先提交真实业务代码，避免工作流文件权限影响主体修复。
          git add -A
          git reset -- .github/workflows/deploy-parent.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix: family-only mode and stable first load"
            git push origin HEAD:main
          fi

          # 再单独尝试简化旧部署工作流；即使仓库策略不允许，也不影响本次部署。
          git add .github/workflows/deploy-parent.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: simplify parent deployment"
            git push origin HEAD:main || {
              echo "Workflow source update was blocked; sites will still be deployed by this run."
              git reset --hard origin/main
            }
          fi

      - name: Deploy student site
        run: >
          npx --yes wrangler@latest pages deploy dist-student
          --project-name=aixuexi
          --branch=main
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy overview site
        run: >
          npx --yes wrangler@latest pages deploy dist-parent
          --project-name=aixuexi-parent
          --branch=main
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
